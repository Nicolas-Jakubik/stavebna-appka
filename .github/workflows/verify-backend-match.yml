name: Verify read-only backend diagnostic (synthetic only)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned source dependencies
        run: npm ci --no-audit --no-fund
      - name: Test auth guard and boolean-only output without a database
        run: node --test tests/admin-backend-match.test.cjs
        env:
          ADMIN_PASSWORD: ''
          NEXT_PUBLIC_SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
      - name: Type check without production credentials
        run: npx tsc --noEmit
        env:
          ADMIN_PASSWORD: ''
          NEXT_PUBLIC_SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
      - name: Build without production credentials
        run: npm run build
        env:
          ADMIN_PASSWORD: ''
          NEXT_PUBLIC_SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
