name: Test synthetic recorder RPC in PostgreSQL 17

on:
  pull_request:
    branches: [main, integration/safe-repairs-batch2-2026-10-28]

permissions:
  contents: read

jobs:
  recorder-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (no persisted token)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify real repository SQL on disposable PostgreSQL 17
        run: bash scripts/test-synthetic-recorder-rpc.sh
