name: Prepare patched dependency lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/next-security-update-2026-10-28'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout designated repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/next-security-update-2026-10-28
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Resolve lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency resolutions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const next = lock.packages['node_modules/next']?.version
          const sharp = lock.packages['node_modules/sharp']?.version
          const config = lock.packages['node_modules/eslint-config-next']?.version
          if (next !== '16.4.3' || config !== '16.4.3') throw new Error('Next.js and ESLint lockfile do not match 16.4.3')
          if (!sharp || sharp.split('.').map(Number)[1] < 35 || (sharp.startsWith('0.35.') && Number(sharp.split('.')[2]) < 5)) {
            throw new Error('sharp is not updated to 0.35.5 or later')
          }
          console.log({ next, sharp, config })
          NODE
      - name: Commit lockfile to this repair branch only
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m "Lock patched Next.js and sharp dependencies"
          git push origin HEAD:refs/heads/fix/next-security-update-2026-10-28
