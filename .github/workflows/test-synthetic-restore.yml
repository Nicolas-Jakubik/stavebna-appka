name: Restore synthetic encrypted PostgreSQL 17 backup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  restore-synthetic-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout test-only code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install age for encrypted synthetic archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
      - name: Back up and restore invented workers, attendance and projects using PostgreSQL 17
        run: bash scripts/test-synthetic-backup-restore.sh
